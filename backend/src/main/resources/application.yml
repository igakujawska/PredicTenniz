server:
  address: 127.0.0.1
  port: 8080
spring:
  application:
    name: courtvision
  datasource:
    url: jdbc:h2:file:./data/courtvision;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
tennis:
  api-key: ${TENNIS_API_KEY:}
